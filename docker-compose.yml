services:
  tcg-log-vault:
    build: .
    image: tcg-log-vault:latest
    container_name: tcg-log-vault
    restart: unless-stopped
    environment:
      TCG_DB_PATH: /data/games.db
    volumes:
      # Left side: a directory on the RAID 1 array. Change it to your mount.
      - /mnt/nas/tcg-log-vault:/data
      # Use the server's timezone, which decides what "today" is for the date
      # field. A container ignores the host's timezone unless it is shared like
      # this. After `timedatectl set-timezone`, restart the container.
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Reachable from the LAN at http://<server-ip>:8088. The app has no login,
      # so never forward this port on the router; use Cloudflare Tunnel + Access
      # for outside access. Use "127.0.0.1:8088:8000" for host-only access.
      - "8088:8000"
